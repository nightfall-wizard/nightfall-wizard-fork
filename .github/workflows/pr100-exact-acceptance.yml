name: PR100 exact merge acceptance v1

on:
  push:
    branches:
      - "pr100-accept-v1-14471b334ab7-7af27fc1f8f4"
    paths:
      - ".github/workflows/pr100-exact-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: "pr100-accept-v1-14471b334ab7-7af27fc1f8f4"
  cancel-in-progress: false

jobs:
  mainnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      HEAD_SHA: "14471b334ab7aeea0585259ffc9b9d03c76a4033"
      BASE_SHA: "7af27fc1f8f4145611a1f96ecd428dfe94811351"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Configure Cargo target directory
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pr100-target" >> "$GITHUB_ENV"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: "14471b334ab7aeea0585259ffc9b9d03c76a4033"
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare exact merge candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cd source

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          git fetch \
            https://github.com/Instinctes/nightfall.git \
            "$BASE_SHA"

          git checkout --detach "$BASE_SHA"

          git config user.name "PR100 Acceptance"
          git config user.email "acceptance@example.invalid"

          if ! git merge --no-ff --no-commit "$HEAD_SHA"; then
            git diff --name-only --diff-filter=U \
              | tee "$GITHUB_WORKSPACE/evidence/conflicts.txt"
            echo "MERGE_CONFLICT"
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-gpg-sign \
              -m "Temporary merge acceptance candidate"
          fi

          candidate="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"

          git rev-parse HEAD^{tree} \
            > "$GITHUB_WORKSPACE/evidence/candidate-tree.txt"

          git log -1 --format=fuller \
            > "$GITHUB_WORKSPACE/evidence/candidate.txt"

          git checkout --detach "$HEAD_SHA"

      - name: Fetch and verify official Mainnet archive
        shell: bash
        run: |
          set -Eeuo pipefail

          E="$GITHUB_WORKSPACE/evidence"

          mkdir -p "$RUNNER_TEMP/archive"

          curl -fLsS --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            --max-filesize 65536 \
            https://nightfallcoin.org/chain/bootstrap.json \
            -o "$E/source-manifest.json"

          read -r asset size checksum < <(
            python3 - "$E/source-manifest.json" <<'PYMAN'
          import json, re, sys, shutil
          from pathlib import Path
          m = json.loads(Path(sys.argv[1]).read_text())
          assert m["network"].lower() == "mainnet"
          assert m["genesis"].lower() == (
              "061a052d49607ff8f4b306c75d622ebd"
              "230cff4ec3a45a6dffc2f7738d4b20de"
          )
          assert re.fullmatch(
              r"nightfall-chain-[0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}\.bin",
              m["archive"]
          )
          assert re.fullmatch(
              r"[a-fA-F0-9]{64}", m["blocks_bin_sha256"]
          )
          assert type(m["height"]) is int
          assert m["height"] > 505000
          assert type(m["archive_bytes"]) is int
          assert 1024 <= m["archive_bytes"] <= 64 * 1024**3
          assert shutil.disk_usage(".").free > (
              3 * m["archive_bytes"] + 3 * 1024**3
          ), "Insufficient runner disk space"
          print(
              m["archive"],
              m["archive_bytes"],
              m["blocks_bin_sha256"].lower()
          )
          PYMAN
          )

          archive="$RUNNER_TEMP/archive/blocks.bin"

          curl -fLsS --retry 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            --max-filesize "$size" \
            "https://github.com/Instinctes/nightfall/releases/download/chain-bootstrap/$asset" \
            -o "$archive"

          test "$(stat -c %s "$archive")" = "$size"

          printf '%s  %s\n' "$checksum" "$archive" \
            | sha256sum --check

      - name: Existing real Mainnet acceptance
        shell: bash
        run: |
          set -Eeuo pipefail

          cd source

          E="$GITHUB_WORKSPACE/evidence"

          run_real() {
            local label="$1"
            local fixture="$RUNNER_TEMP/fixture-$label"

            mkdir "$fixture"

            cp "$RUNNER_TEMP/archive/blocks.bin" \
              "$fixture/blocks.bin"

            export NF_PR100_ARCHIVE_COPY="$fixture"

            test -f crates/nightfall-storage/tests/pr100_real_checkpoint_acceptance.rs
            test -f scripts/pr100_production_gate.py

            cargo test \
              --release --locked \
              -p nightfall-storage \
              --test pr100_real_checkpoint_acceptance \
              -- --ignored --nocapture \
              2>&1 | tee "$E/$label.log"

            python3 - "$E/$label.log" "$E/$label.json" <<'PYRECEIPT'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from pr100_production_gate import parse_mainnet_pass
          output = Path(sys.argv[1]).read_text()
          result = parse_mainnet_pass(output)
          assert result is not None, "Invalid acceptance receipt"
          assert "test result: ok. 1 passed;" in output
          Path(sys.argv[2]).write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PYRECEIPT

            git diff --exit-code
          }

          head_tree="$(git rev-parse HEAD^{tree})"

          run_real head

          git checkout --detach "$CANDIDATE_SHA"

          candidate_tree="$(git rev-parse HEAD^{tree})"

          if [ "$head_tree" = "$candidate_tree" ]; then
            echo "Identical tree: reusing acceptance receipt"
            cp "$E/head.json" "$E/merged.json"
          else
            run_real merged
          fi

      - name: Snapshot producer and CLI restart
        shell: bash
        run: |
          set -Eeuo pipefail

          cd source

          E="$GITHUB_WORKSPACE/evidence"
          export NF_PR100_ARCHIVE_COPY="$RUNNER_TEMP/archive"
          export NF_PR100_PRODUCER_DIR="$RUNNER_TEMP/producer"

          mkdir "$NF_PR100_PRODUCER_DIR"

          testfile="crates/nightfall-storage/tests/pr100_accept_producer_fixture.rs"

          test ! -e "$testfile"

          cat > "$testfile" <<'RUST'
          use nightfall_storage::ChainStore;
          use nightfall_types::NetworkId;
          use std::path::PathBuf;

          #[test]
          fn materialize_verified_public_archive() {
              let source = PathBuf::from(
                  std::env::var("NF_PR100_ARCHIVE_COPY").unwrap()
              );
              let target = PathBuf::from(
                  std::env::var("NF_PR100_PRODUCER_DIR").unwrap()
              );
              let chain = ChainStore::new(source)
                  .load_or_new(NetworkId::Mainnet)
                  .unwrap();
              assert_eq!(chain.first_height, 0);
              chain.verify_supply().unwrap();
              assert!(!target.join("blocks.bin").exists());
              ChainStore::new(target).save(&chain).unwrap();
          }
          RUST

          trap 'rm -f -- "$testfile"' EXIT

          cargo test --release --locked \
            -p nightfall-storage \
            --test pr100_accept_producer_fixture \
            -- --nocapture \
            2>&1 | tee "$E/producer-fixture.log"

          rm -f -- "$testfile"
          trap - EXIT

          git diff --exit-code

          published="$RUNNER_TEMP/published"

          bash scripts/make-checkpoint-bootstrap.sh \
            --datadir "$NF_PR100_PRODUCER_DIR" \
            --out "$published" \
            2>&1 | tee "$E/producer.log"

          snap="$(python3 - "$published" "$E" <<'PYVERIFY'
          import hashlib, json, re, sys
          from pathlib import Path

          folder = Path(sys.argv[1])
          evidence = Path(sys.argv[2])

          def digest(path):
              with path.open("rb") as f:
                  return hashlib.file_digest(f, "sha256").hexdigest()

          m = json.loads(
              (folder / "bootstrap.json").read_text()
          )
          source = json.loads(
              (evidence / "source-manifest.json").read_text()
          )
          assert m["network"].lower() == "mainnet"
          assert m["genesis"].lower() == source["genesis"].lower()
          assert m["tip"].lower() == source["tip"].lower()
          assert m["height"] == source["height"]

          assert re.fullmatch(
              r"nightfall-chain-[0-9-]+\.bin", m["archive"]
          )
          a = folder / m["archive"]
          assert a.stat().st_size == m["archive_bytes"]
          assert digest(a) == m["blocks_bin_sha256"].lower()

          c = m["checkpoint"]
          assert re.fullmatch(
              r"nightfall-checkpoint-[0-9-]+\.bin", c["file"]
          )
          p = folder / c["file"]
          assert 0 < c["bytes"] <= 512 * 1024**2
          assert p.stat().st_size == c["bytes"]
          assert digest(p) == c["sha256"].lower()

          real = json.loads(
              (evidence / "merged.json").read_text()
          )
          assert c["height"] == int(real["checkpoint"])

          (evidence / "produced-manifest.json").write_text(
              json.dumps(m, indent=2) + "\n"
          )
          print(p)
          PYVERIFY
          )"

          restore="$RUNNER_TEMP/cli-restored"

          cargo run --release --locked \
            -p nightfall-node -- \
            --network mainnet \
            --datadir "$restore" \
            import-checkpoint-snapshot --from "$snap" \
            2>&1 | tee "$E/cli-import.log"

          cargo run --release --locked \
            -p nightfall-node -- \
            --network mainnet \
            --datadir "$restore" status \
            2>&1 | tee "$E/cli-restart.log"

          grep -Eq '^kernels\.+[[:space:]]+unknown' \
            "$E/cli-restart.log"

          grep -Eq '^transactions\.+[[:space:]]+unknown' \
            "$E/cli-restart.log"

          grep -Eq '^supply_proof\.+[[:space:]]+OK' \
            "$E/cli-restart.log"

          python3 - "$E" <<'PYSTATUS'
          import json, re, sys
          from pathlib import Path

          e = Path(sys.argv[1])
          m = json.loads(
              (e / "produced-manifest.json").read_text()
          )
          log = (e / "cli-restart.log").read_text()
          tip = re.search(
              r"^tip_height\.+\s+(\d+)",
              log, re.MULTILINE
          )
          assert tip and int(tip[1]) == m["checkpoint"]["height"]

          print("PRODUCER_AND_CLI_RESTART_PASS")
          PYSTATUS

      - name: Create final evidence receipt
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$GITHUB_WORKSPACE/evidence" <<'PYFINAL'
          import json, os, sys
          from pathlib import Path
          e = Path(sys.argv[1])

          result = {
              "head": os.environ["HEAD_SHA"],
              "base": os.environ["BASE_SHA"],
              "candidate": os.environ["CANDIDATE_SHA"],
              "candidate_tree": (
                  e / "candidate-tree.txt"
              ).read_text().strip(),
              "archive_sha256": json.loads(
                  (e / "source-manifest.json").read_text()
              )["blocks_bin_sha256"],
              "head_acceptance": json.loads(
                  (e / "head.json").read_text()
              ),
              "merged_acceptance": json.loads(
                  (e / "merged.json").read_text()
              ),
              "producer_cli_restart": "PASS",
              "core_gui": "NOT_TESTED",
              "genuine_legacy_112_recovery": "NOT_TESTED",
              "independent_security_audit": "NOT_TESTED",
              "status": "PASS_LIMITED"
          }

          (e / "summary.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PYFINAL

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr100-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
