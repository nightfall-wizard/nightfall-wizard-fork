name: WIP PR17 targeted Rust validation
on:
  push:
    branches:
      - wip/pr17-legacy-refusal-s8-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Targeted regression
        run: cargo test --locked -p nightfall-storage legacy_pruned_validation_record_fails_closed_without_seals
      - name: Node Kit explicit upgrade refusal CLI
        run: cargo test --locked -p nightfall-nodekit --test upgrade_pruned_cli
      - name: Node Kit compile and check
        run: cargo check --locked -p nightfall-nodekit --all-targets
