name: PR22 Real Dandelion Multinode Tests

on:
  push:
    branches:
      - 'validation/pr22-multinode-*'

permissions:
  contents: read

jobs:
  real-multinode:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Real Dandelion multi-node regression
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test -p nightfall-node \
            --test dandelion_multinode \
            -- --ignored --test-threads=1 --nocapture